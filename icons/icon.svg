<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#04060c"/>
    </radialGradient>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Specular Outer Rim -->
  <rect width="508" height="508" x="2" y="2" rx="126" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Ambient Light Halo -->
  <circle cx="256" cy="256" r="180" fill="url(#glowGrad)" filter="url(#softGlow)"/>

  <!-- Geometric Outer Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(245, 158, 11, 0.25)" stroke-width="2" stroke-dasharray="6 8"/>

  <!-- Crescent Moon -->
  <path d="M290 140 C210 155 160 230 185 310 C210 390 295 415 355 375 C285 395 215 355 205 285 C195 215 245 155 290 140 Z" fill="url(#moonGrad)" filter="url(#softGlow)"/>

  <!-- Sanctuary Star (8-point) -->
  <g transform="translate(330, 205) scale(0.9)">
    <polygon points="0,-32 8,-10 30,-10 13,4 20,26 0,14 -20,26 -13,4 -30,-10 -8,-10" fill="#fef08a"/>
    <circle cx="0" cy="4" r="5" fill="#f59e0b"/>
  </g>

  <!-- Subtle Accent Sparkles -->
  <circle cx="160" cy="180" r="3" fill="#67e8f9" opacity="0.8"/>
  <circle cx="360" cy="320" r="2.5" fill="#fde68a" opacity="0.7"/>
  <circle cx="170" cy="340" r="2" fill="#a855f7" opacity="0.6"/>
</svg>
